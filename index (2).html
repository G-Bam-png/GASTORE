<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TechStore</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0F1923;--surface:#162130;--card:#1C2B3A;--border:rgba(255,255,255,0.08);--blue:#2AABEE;--green:#2ECC8A;--red:#E85555;--amber:#F5A623;--text:#EDF2F7;--muted:#6B8299;--accent:#54B8FF;--radius:8px;--radius-lg:12px}
body{background:#0a1520;font-family:'Segoe UI',system-ui,sans-serif;display:flex;justify-content:center;min-height:100vh;padding:20px}
.phone{width:390px;min-height:680px;display:flex;flex-direction:column;background:var(--bg);border-radius:24px;overflow:hidden;border:0.5px solid var(--border);box-shadow:0 8px 40px rgba(0,0,0,.5)}
.topbar{background:var(--surface);padding:13px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:0.5px solid var(--border);flex-shrink:0}
.topbar-left{display:flex;align-items:center;gap:9px}
.logo{width:30px;height:30px;background:var(--blue);border-radius:9px;display:flex;align-items:center;justify-content:center}
.logo i{font-size:15px;color:#fff}
.shop-name{color:var(--text);font-size:16px;font-weight:600;letter-spacing:-.3px}
.icon-btn{background:none;border:none;color:var(--muted);cursor:pointer;padding:5px;display:flex;align-items:center;position:relative;border-radius:var(--radius);transition:background .15s}
.icon-btn:hover{background:var(--card)}
.icon-btn i{font-size:22px}
.badge{position:absolute;top:-2px;right:-2px;background:var(--red);color:#fff;font-size:9px;font-weight:700;width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.content{flex:1;overflow-y:auto;padding:14px}
.content::-webkit-scrollbar{width:3px}
.content::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.nav{background:var(--surface);display:flex;border-top:0.5px solid var(--border);flex-shrink:0}
.nav-btn{flex:1;background:none;border:none;color:var(--muted);padding:9px 4px 8px;cursor:pointer;font-size:10px;display:flex;flex-direction:column;align-items:center;gap:2px;transition:color .15s;font-family:inherit}
.nav-btn i{font-size:20px}
.nav-btn.on{color:var(--blue)}
.scr{display:none}.scr.on{display:block}
.sbar{background:var(--surface);border:0.5px solid var(--border);border-radius:var(--radius);display:flex;align-items:center;gap:8px;padding:8px 11px;margin-bottom:12px}
.sbar i{color:var(--muted);font-size:16px;flex-shrink:0}
.sbar input{background:none;border:none;color:var(--text);font-size:13px;flex:1;outline:none;font-family:inherit}
.sbar input::placeholder{color:var(--muted)}
.cats{display:flex;gap:6px;margin-bottom:13px;overflow-x:auto;padding-bottom:2px}
.cats::-webkit-scrollbar{display:none}
.chip{background:var(--surface);border:0.5px solid var(--border);border-radius:20px;padding:5px 12px;color:var(--muted);font-size:12px;cursor:pointer;white-space:nowrap;transition:all .15s;font-family:inherit}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.pgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.pcard{background:var(--surface);border:0.5px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;transition:border-color .15s,transform .15s}
.pcard:hover{border-color:rgba(42,171,238,.4);transform:translateY(-1px)}
.pimg{width:100%;height:96px;display:flex;align-items:center;justify-content:center;font-size:40px;background:var(--card)}
.pinfo{padding:9px 10px}
.pname{color:var(--text);font-size:12px;font-weight:600;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pdesc{color:var(--muted);font-size:11px;margin-bottom:8px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:28px}
.pfoot{display:flex;align-items:center;justify-content:space-between}
.pprice{color:var(--green);font-size:13px;font-weight:700}
.abtn{background:var(--blue);border:none;color:#fff;width:26px;height:26px;border-radius:50%;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:transform .1s,background .15s}
.abtn:hover{background:#1a9fd4}
.abtn:active{transform:scale(.88)}
.no-stock{font-size:10px;color:var(--red);background:rgba(232,85,85,.1);padding:3px 7px;border-radius:10px}
.empty{text-align:center;padding:50px 20px;color:var(--muted)}
.empty i{font-size:44px;opacity:.25;display:block;margin-bottom:12px}
.empty p{font-size:13px}
.loading{text-align:center;padding:40px 20px;color:var(--muted)}
.loading i{font-size:32px;opacity:.4;display:block;margin-bottom:10px;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ci{background:var(--surface);border:0.5px solid var(--border);border-radius:var(--radius);padding:10px 11px;margin-bottom:8px;display:flex;align-items:center;gap:10px}
.cimg{font-size:28px;width:38px;text-align:center;flex-shrink:0}
.cinf{flex:1;min-width:0}
.cname{color:var(--text);font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cprice{color:var(--muted);font-size:11px;margin-top:2px}
.qctrl{display:flex;align-items:center;gap:6px;flex-shrink:0}
.qbtn{background:var(--card);border:0.5px solid var(--border);color:var(--text);width:24px;height:24px;border-radius:50%;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center}
.qval{color:var(--text);font-size:13px;font-weight:600;min-width:16px;text-align:center}
.totbox{background:var(--surface);border:0.5px solid var(--border);border-radius:var(--radius);padding:12px 14px;margin:12px 0}
.trow{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px}
.trow:last-child{margin-bottom:0;font-size:15px;font-weight:600;padding-top:8px;border-top:0.5px solid var(--border)}
.tlabel{color:var(--muted)}.tval{color:var(--text)}
.cbtn{width:100%;background:var(--blue);border:none;color:#fff;padding:13px;border-radius:var(--radius);font-size:14px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;font-family:inherit;transition:background .15s}
.cbtn:hover{background:#1a9fd4}
.cbtn i{font-size:18px}
.msgs{display:flex;flex-direction:column;gap:8px;min-height:400px;padding-bottom:8px}
.msg{max-width:82%}.msg.u{align-self:flex-end}.msg.b{align-self:flex-start}
.bub{padding:9px 13px;border-radius:14px;font-size:13px;line-height:1.5}
.msg.u .bub{background:var(--blue);color:#fff;border-bottom-right-radius:3px}
.msg.b .bub{background:var(--surface);color:var(--text);border:0.5px solid var(--border);border-bottom-left-radius:3px}
.mtime{font-size:10px;color:var(--muted);margin-top:3px}
.msg.u .mtime{text-align:right}
.bavtr{width:26px;height:26px;background:var(--blue);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;margin-bottom:4px}
.cinrow{display:flex;gap:8px;margin-top:10px;align-items:flex-end}
.cinput{flex:1;background:var(--surface);border:0.5px solid var(--border);border-radius:var(--radius);padding:9px 12px;color:var(--text);font-size:13px;resize:none;outline:none;font-family:inherit;max-height:80px}
.cinput::placeholder{color:var(--muted)}
.cinput:focus{border-color:rgba(42,171,238,.5)}
.sbtn{background:var(--blue);border:none;color:#fff;width:36px;height:36px;border-radius:var(--radius);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sbtn i{font-size:17px}
.ocrd{background:var(--surface);border:0.5px solid var(--border);border-radius:var(--radius-lg);padding:12px 14px;margin-bottom:9px}
.ohdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px}
.oid{color:var(--text);font-size:13px;font-weight:600}
.ostat{font-size:10px;padding:3px 8px;border-radius:20px;font-weight:600}
.s-new{background:rgba(42,171,238,.15);color:var(--blue)}
.s-ok{background:rgba(46,204,138,.15);color:var(--green)}
.s-go{background:rgba(245,166,35,.15);color:var(--amber)}
.oitems{color:var(--muted);font-size:12px;margin-bottom:6px;line-height:1.5}
.oftr{display:flex;justify-content:space-between;font-size:12px}
.ototal{color:var(--green);font-weight:600}.odate{color:var(--muted)}
.contact-card{background:var(--surface);border:0.5px solid var(--border);border-radius:var(--radius-lg);padding:16px;margin-bottom:12px}
.contact-row{display:flex;align-items:center;gap:10px;padding:10px;background:var(--card);border-radius:var(--radius);margin-bottom:8px}
.contact-row:last-child{margin-bottom:0}
.contact-row i{font-size:20px;flex-shrink:0}
.contact-label{color:var(--muted);font-size:11px}
.contact-val{color:var(--text);font-size:13px;font-weight:500}
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:var(--green);color:#fff;padding:9px 18px;border-radius:24px;font-size:13px;font-weight:600;display:none;white-space:nowrap;z-index:200;box-shadow:0 4px 20px rgba(0,0,0,.3)}
.toast.err{background:var(--red)}
.toast.show{display:block;animation:ftio 2.5s forwards}
@keyframes ftio{0%{opacity:0;transform:translateX(-50%) translateY(12px)}12%{opacity:1;transform:translateX(-50%) translateY(0)}80%{opacity:1}100%{opacity:0}}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:-2px;margin-right:6px}
</style>
</head>
<body>
<div class="phone">
  <div class="topbar">
    <div class="topbar-left">
      <div class="logo"><i class="ti ti-cpu"></i></div>
      <span class="shop-name" id="sname">TechStore</span>
    </div>
    <button class="icon-btn" onclick="go('cart')" aria-label="Корзина">
      <i class="ti ti-shopping-cart"></i>
      <span class="badge" id="cbadge" style="display:none">0</span>
    </button>
  </div>
  <div class="content" id="main-content">
    <div class="scr on" id="scr-shop">
      <div class="sbar"><i class="ti ti-search"></i><input id="q" placeholder="Поиск техники..." oninput="renderProducts()"></div>
      <div class="cats" id="cats-bar"></div>
      <div class="pgrid" id="pgrid"><div class="loading" style="grid-column:1/-1"><i class="ti ti-loader-2"></i><p>Загружаем товары...</p></div></div>
    </div>
    <div class="scr" id="scr-cart"><div id="cart-body"></div></div>
    <div class="scr" id="scr-support">
      <div class="msgs" id="msgs">
        <div class="msg b"><div class="bavtr">🤖</div><div class="bub">Привет! Я поддержка TechStore. Помогу с выбором техники или вопросом по заказу 👋</div><div class="mtime">Сейчас</div></div>
      </div>
      <div class="cinrow">
        <textarea class="cinput" id="cin" rows="1" placeholder="Написать..."></textarea>
        <button class="sbtn" onclick="sendChat()"><i class="ti ti-send"></i></button>
      </div>
    </div>
    <div class="scr" id="scr-orders">
      <div style="color:var(--muted);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;margin-bottom:12px">Мои заказы</div>
      <div id="orders-list"><div class="empty"><i class="ti ti-receipt-off"></i><p>Заказов пока нет</p></div></div>
    </div>
    <div class="scr" id="scr-contacts">
      <div class="contact-card">
        <div class="contact-row"><i class="ti ti-brand-telegram" style="color:var(--blue)"></i><div><div class="contact-label">Telegram</div><div class="contact-val" id="c-tg">@GA_STORE_TECH_bot</div></div></div>
        <div class="contact-row"><i class="ti ti-phone" style="color:var(--green)"></i><div><div class="contact-label">Телефон</div><div class="contact-val" id="c-phone">+7 (999) 000-00-00</div></div></div>
        <div class="contact-row"><i class="ti ti-clock" style="color:var(--amber)"></i><div><div class="contact-label">Режим работы</div><div class="contact-val">Пн–Вс, 9:00–21:00</div></div></div>
      </div>
    </div>
  </div>
  <nav class="nav">
    <button class="nav-btn on" id="nb-shop" onclick="go('shop')"><i class="ti ti-home"></i>Магазин</button>
    <button class="nav-btn" id="nb-cart" onclick="go('cart')"><i class="ti ti-shopping-cart"></i>Корзина</button>
    <button class="nav-btn" id="nb-support" onclick="go('support')"><i class="ti ti-headset"></i>Чат</button>
    <button class="nav-btn" id="nb-orders" onclick="go('orders')"><i class="ti ti-receipt"></i>Заказы</button>
    <button class="nav-btn" id="nb-contacts" onclick="go('contacts')"><i class="ti ti-info-circle"></i>Контакты</button>
  </nav>
</div>
<div class="toast" id="toast"></div>
<script>
const CATS={all:'Все',laptop:'Ноутбуки',phone:'Смартфоны',audio:'Аудио',accessories:'Аксессуары',tablet:'Планшеты',other:'Другое'};
const CLOUD_BIN='6a160f2ff47d5c455c3ab07a';
const CLOUD_KEY='$2a$10$KeU2XuDxfOObkYViwQlu0u4HNqohvnAJS6gxVbO8UAHYKc4ueCehi';
const BOT_TOKEN='8942512397:AAF7UNFTV_y9C4l8c1Or9LsfEx7ANRRLjKI';
const CHAT_ID='6237753129';
let products=[];
let cart={};
let curCat='all';
let ri=0;
const botR=['Понял! Передаю оператору, ответим в течение 10 минут.','Статус заказа смотрите во вкладке «Заказы».','Уточните, пожалуйста, номер заказа.','Мы работаем 24/7, скоро ответим!','Вопрос принят, ожидайте ответа.'];

async function loadProducts(){
  try{
    const r=await fetch('https://api.jsonbin.io/v3/b/'+CLOUD_BIN+'/latest',{headers:{'X-Master-Key':CLOUD_KEY,'X-Bin-Meta':'false'}});
    const d=await r.json();
    if(d&&d.products){
      products=d.products;
      if(d.shopName)document.getElementById('sname').textContent=d.shopName;
      if(d.tg)document.getElementById('c-tg').textContent=d.tg;
      if(d.phone)document.getElementById('c-phone').textContent=d.phone;
    }else if(Array.isArray(d)){products=d;}
  }catch(e){
    document.getElementById('pgrid').innerHTML='<div class="empty" style="grid-column:1/-1"><i class="ti ti-wifi-off"></i><p>Ошибка загрузки.<br>Проверьте соединение.</p></div>';
    return;
  }
  renderCats();renderProducts();
}
function renderCats(){
  const bar=document.getElementById('cats-bar');
  const cats=['all',...new Set(products.map(p=>p.cat))];
  bar.innerHTML=cats.map(c=>'<div class="chip'+(c===curCat?' on':'')+'" onclick="setCat(\''+c+'\',this)">'+( CATS[c]||c)+'</div>').join('');
}
function setCat(c,el){curCat=c;document.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));el.classList.add('on');renderProducts();}
function renderProducts(){
  const q=document.getElementById('q').value.toLowerCase().trim();
  let list=products.filter(p=>(curCat==='all'||p.cat===curCat)&&(!q||p.name.toLowerCase().includes(q)||p.desc.toLowerCase().includes(q)));
  const grid=document.getElementById('pgrid');
  if(!list.length){grid.innerHTML='<div class="empty" style="grid-column:1/-1"><i class="ti ti-search-off"></i><p>Ничего не найдено</p></div>';return;}
  grid.innerHTML=list.map(p=>'<div class="pcard"><div class="pimg">'+p.emoji+'</div><div class="pinfo"><div class="pname">'+p.name+'</div><div class="pdesc">'+p.desc+'</div><div class="pfoot"><span class="pprice">'+p.price.toLocaleString('ru')+' \u20bd</span>'+(p.stock?'<button class="abtn" onclick="addCart('+p.id+')">+</button>':'<span class="no-stock">\u041d\u0435\u0442</span>')+'</div></div></div>').join('');
}
function addCart(id){cart[id]=(cart[id]||0)+1;updateBadge();toast('Добавлено в корзину ✓');}
function updateBadge(){const t=Object.values(cart).reduce((a,b)=>a+b,0);const b=document.getElementById('cbadge');if(t>0){b.style.display='flex';b.textContent=t;}else b.style.display='none';}
function renderCart(){
  const el=document.getElementById('cart-body');
  const keys=Object.keys(cart).filter(k=>cart[k]>0);
  if(!keys.length){el.innerHTML='<div class="empty"><i class="ti ti-shopping-cart-off"></i><p>Корзина пуста</p><p style="font-size:11px;margin-top:6px;color:var(--muted)">Выберите товары в магазине</p></div>';return;}
  let total=0;
  const items=keys.map(k=>{const p=products.find(x=>x.id==k);if(!p)return'';const s=p.price*cart[k];total+=s;return'<div class="ci"><div class="cimg">'+p.emoji+'</div><div class="cinf"><div class="cname">'+p.name+'</div><div class="cprice">'+p.price.toLocaleString('ru')+' \u20bd / \u0448\u0442</div></div><div class="qctrl"><button class="qbtn" onclick="chQ('+k+',-1)">−</button><span class="qval">'+cart[k]+'</span><button class="qbtn" onclick="chQ('+k+',1)">+</button></div></div>';}).join('');
  const del=total>5000?0:349;
  el.innerHTML=items+'<div class="totbox"><div class="trow"><span class="tlabel">Товары</span><span class="tval">'+total.toLocaleString('ru')+' \u20bd</span></div><div class="trow"><span class="tlabel">Доставка</span><span class="tval">'+(del===0?'<span style="color:var(--green)">\u0411\u0435\u0441\u043f\u043b\u0430\u0442\u043d\u043e</span>':del.toLocaleString('ru')+' \u20bd')+'</span></div><div class="trow"><span class="tlabel">\u0418\u0442\u043e\u0433\u043e</span><span class="tval" style="color:var(--green)">'+(total+del).toLocaleString('ru')+' \u20bd</span></div></div><button class="cbtn" onclick="checkout()"><i class="ti ti-brand-telegram"></i>\u041e\u0444\u043e\u0440\u043c\u0438\u0442\u044c \u0437\u0430\u043a\u0430\u0437</button>';
}
function chQ(id,d){cart[id]=Math.max(0,(cart[id]||0)+d);if(!cart[id])delete cart[id];updateBadge();renderCart();}
async function checkout(){
  const keys=Object.keys(cart).filter(k=>cart[k]>0);if(!keys.length)return;
  const btn=document.querySelector('.cbtn');btn.innerHTML='<span class="spinner"></span>Отправляем...';btn.disabled=true;
  const oid='#'+(1000+Math.floor(Math.random()*9000));
  let total=0;
  const lines=keys.map(k=>{const p=products.find(x=>x.id==k);if(!p)return'';const s=p.price*cart[k];total+=s;return p.emoji+' '+p.name+' \u00d7 '+cart[k]+' \u2014 '+s.toLocaleString('ru')+' \u20bd';}).filter(Boolean);
  const del=total>5000?0:349;
  const shopName=document.getElementById('sname').textContent;
  const msg='🛒 <b>Новый заказ '+oid+'</b>\n📦 '+shopName+'\n\n'+lines.join('\n')+'\n\n💰 Доставка: '+(del===0?'Бесплатно':del.toLocaleString('ru')+' ₽')+'\n✅ <b>Итого: '+(total+del).toLocaleString('ru')+' ₽</b>\n🕐 '+new Date().toLocaleString('ru');
  let sent=false;
  try{const r=await fetch('https://api.telegram.org/bot'+BOT_TOKEN+'/sendMessage',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({chat_id:CHAT_ID,text:msg,parse_mode:'HTML'})});const d=await r.json();sent=d.ok;}catch(e){}
  const orderEl=document.createElement('div');orderEl.className='ocrd';
  orderEl.innerHTML='<div class="ohdr"><span class="oid">Заказ '+oid+'</span><span class="ostat s-new">Новый</span></div><div class="oitems">'+lines.join('<br>')+'</div><div class="oftr"><span class="ototal">'+(total+del).toLocaleString('ru')+' ₽</span><span class="odate">Только что</span></div>';
  const ol=document.getElementById('orders-list');if(ol.querySelector('.empty'))ol.innerHTML='';ol.prepend(orderEl);
  cart={};updateBadge();
  btn.innerHTML='<i class="ti ti-brand-telegram"></i>Оформить заказ';btn.disabled=false;
  toast(sent?'✅ Заказ отправлен в Telegram!':'✅ Заказ оформлен!');
  go('orders');
}
function sendChat(){
  const inp=document.getElementById('cin');const txt=inp.value.trim();if(!txt)return;
  const msgs=document.getElementById('msgs');
  const t=new Date().toLocaleTimeString('ru',{hour:'2-digit',minute:'2-digit'});
  msgs.innerHTML+='<div class="msg u"><div class="bub">'+txt+'</div><div class="mtime">'+t+'</div></div>';
  inp.value='';msgs.scrollTop=msgs.scrollHeight;
  setTimeout(()=>{msgs.innerHTML+='<div class="msg b"><div class="bavtr">🤖</div><div class="bub">'+botR[ri++%botR.length]+'</div><div class="mtime">'+t+'</div></div>';msgs.scrollTop=msgs.scrollHeight;},900);
}
document.addEventListener('keydown',e=>{if(document.activeElement===document.getElementById('cin')&&e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendChat();}});
function go(name){
  document.querySelectorAll('.scr').forEach(s=>s.classList.remove('on'));
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('on'));
  document.getElementById('scr-'+name).classList.add('on');
  const nb=document.getElementById('nb-'+name);if(nb)nb.classList.add('on');
  document.getElementById('main-content').scrollTop=0;
  if(name==='cart')renderCart();
}
function toast(msg,type=''){const t=document.getElementById('toast');t.textContent=msg;t.className='toast'+(type?' '+type:'')+' show';setTimeout(()=>t.className='toast'+(type?' '+type:''),2600);}
loadProducts();
</script>
